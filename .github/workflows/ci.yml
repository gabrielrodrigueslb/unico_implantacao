name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Escopo explícito — o tsconfig/eslint da raiz não excluem server/ (que
      # tem seu próprio tsconfig e é typechecado no job "backend"), e
      # server/node_modules não existe neste job.
      - run: npx eslint app components features lib
      # "next build" já typechecka o projeto (e precisa rodar primeiro pra
      # gerar .next/types — sem isso um "tsc --noEmit" solto falha em tipos
      # como LayoutProps, que só existem depois do build).
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

  backend:
    name: Backend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run build
