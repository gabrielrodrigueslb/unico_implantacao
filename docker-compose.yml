services:
  postgres:
    image: postgres:16
    container_name: unico-implantacao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no ambiente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no ambiente}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - unico_implantacao_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: unico-implantacao-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no ambiente}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - unico_implantacao_redis_data:/data

volumes:
  unico_implantacao_postgres_data:
  unico_implantacao_redis_data:
